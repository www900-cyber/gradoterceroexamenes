<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>English Exam: Parts of the House & Technology (Grade 3)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --error: #dc2626;
            --error-bg: #fee2e2;
            --border: #cbd5e1;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text);
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 2px solid #e2e8f0;
        }

        .quiz-header {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            padding: 1.8rem;
            text-align: center;
        }

        .quiz-header h1 {
            font-size: 1.6rem;
            margin-bottom: 0.4rem;
        }

        .quiz-header p {
            font-size: 1rem;
            opacity: 0.95;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #22c55e;
            transition: width 0.3s ease;
        }

        .quiz-body {
            padding: 2rem;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .img-container {
            width: 100%;
            height: 240px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            background-color: #f1f5f9;
            border: 2px solid #e2e8f0;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            color: var(--text);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 1rem 1.2rem;
            text-align: left;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            color: var(--text);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #eff6ff;
            transform: translateY(-2px);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: #dbeafe;
        }

        .option-btn.correct {
            border-color: var(--success);
            background: var(--success-bg);
            color: #14532d;
        }

        .option-btn.wrong {
            border-color: var(--error);
            background: var(--error-bg);
            color: #7f1d1d;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .feedback-box {
            padding: 1rem 1.2rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            line-height: 1.5;
            display: none;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.correct {
            background: var(--success-bg);
            border: 2px solid #86efac;
            color: #14532d;
            font-weight: 600;
        }

        .feedback-box.wrong {
            background: var(--error-bg);
            border: 2px solid #fca5a5;
            color: #7f1d1d;
            font-weight: 600;
        }

        .quiz-footer {
            display: flex;
            justify-content: flex-end;
        }

        .btn-next {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
        }

        .btn-next:hover {
            background: var(--primary-hover);
        }

        .signature-footer {
            text-align: center;
            padding: 1.2rem;
            border-top: 2px solid #e2e8f0;
            background-color: #f8fafc;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .results-card {
            text-align: center;
            padding: 2.5rem 1rem;
        }

        .results-score {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 1rem 0;
        }

        .results-msg {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .btn-restart {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem 2.2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body translate="no" class="notranslate">

        question: "20. What technological tool prints photos and documents from a computer onto paper?",

let questions = [];
let currentQuestion = 0;
let score = 0;
let selectedOption = null;

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function prepareQuestions() {
    const prefixes = ["A) ", "B) ", "C) ", "D) "];
    questions = rawQuestions.map(item => {
        const allTexts = shuffleArray([item.correctText, ...item.distractors]);
        const correctIndex = allTexts.indexOf(item.correctText);
        const optionsWithPrefix = allTexts.map((text, idx) => prefixes[idx] + text);

        return {
            category: item.category,
            image: item.image,
            question: item.question,
            options: optionsWithPrefix,
            answer: correctIndex,
            explanation: item.explanation
        };
    });
}

function loadQuestion() {
    const q = questions[currentQuestion];
    const quizBody = document.getElementById("quizBody");
    const progressBar = document.getElementById("progressBar");

    progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

    quizBody.innerHTML = `
        <div class="meta-info">
            <span class="badge">${q.category}</span>
            <span>Question ${currentQuestion + 1} of ${questions.length}</span>
        </div>
        <div class="img-container">
            <img src="${q.image}" alt="Question Illustration">
        </div>
        <div class="question-text">${q.question}</div>
        <div class="options-grid">
            ${q.options.map((opt, idx) => `
                <button class="option-btn" onclick="selectOption(${idx})" id="opt-${idx}">
                    ${opt}
                </button>
            `).join('')}
        </div>
        <div class="feedback-box" id="feedbackBox"></div>
        <div class="quiz-footer">
            <button class="btn-next" id="btnNext" onclick="submitAnswer()" disabled>Confirm Answer</button>
        </div>
    `;
    selectedOption = null;
}

function selectOption(index) {
    if (document.getElementById("btnNext").textContent === "Next Question" || 
        document.getElementById("btnNext").textContent === "View Results") return;

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach((btn, idx) => {
        btn.classList.remove("selected");
        if (idx === index) btn.classList.add("selected");
    });

    selectedOption = index;
    document.getElementById("btnNext").disabled = false;
}

function submitAnswer() {
    const btnNext = document.getElementById("btnNext");
    const feedbackBox = document.getElementById("feedbackBox");
    const q = questions[currentQuestion];

    if (btnNext.textContent === "Next Question") {
        currentQuestion++;
        loadQuestion();
        return;
    } else if (btnNext.textContent === "View Results") {
        showResults();
        return;
    }

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(btn => btn.disabled = true);

    if (selectedOption === q.answer) {
        score++;
        buttons[selectedOption].classList.add("correct");
        feedbackBox.className = "feedback-box show correct";
        feedbackBox.innerHTML = `🌟 <strong>Great job!</strong> ${q.explanation}`;
    } else {
        buttons[selectedOption].classList.add("wrong");
        buttons[q.answer].classList.add("correct");
        feedbackBox.className = "feedback-box show wrong";
        feedbackBox.innerHTML = `❌ <strong>Not quite!</strong> ${q.explanation}`;
    }

    if (currentQuestion < questions.length - 1) {
        btnNext.textContent = "Next Question";
    } else {
        btnNext.textContent = "View Results";
    }
}

function showResults() {
    const quizBody = document.getElementById("quizBody");
    const percentage = Math.round((score / questions.length) * 100);

    let feedbackMessage = "";
    if (percentage >= 80) {
        feedbackMessage = "🎉 Amazing! You are a superstar in English, house vocabulary, and technology!";
    } else if (percentage >= 60) {
        feedbackMessage = "👍 Good job! You know your house and technology well.";
    } else {
        feedbackMessage = "💪 Keep practicing! Review the parts of the house and devices to get better.";
    }

    quizBody.innerHTML = `
        <div class="results-card">
            <h2>Quiz Finished! 🏆</h2>
            <div class="results-score">${score} / ${questions.length}</div>
            <p style="font-size: 1.2rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem;">Score: ${percentage}%</p>
            <p class="results-msg">${feedbackMessage}</p>
            <button class="btn-restart" onclick="restartQuiz()">Play Again 🔄</button>
        </div>
    `;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    prepareQuestions();
    loadQuestion();
}

prepareQuestions();
loadQuestion();
</script>
