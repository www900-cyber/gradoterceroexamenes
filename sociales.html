                </button>
            `).join('')}
        </div>
        <div class="feedback-box" id="feedbackBox"></div>
        <div class="quiz-footer">
            <button class="btn-next" id="btnNext" onclick="submitAnswer()" disabled>Confirmar Respuesta</button>
        </div>
    `;
    selectedOption = null;
}

function selectOption(index) {
    if (document.getElementById("btnNext").textContent === "Siguiente Pregunta" || 
        document.getElementById("btnNext").textContent === "Ver Resultados") return;

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach((btn, idx) => {
        btn.classList.remove("selected");
        if (idx === index) btn.classList.add("selected");
    });

    selectedOption = index;
    document.getElementById("btnNext").disabled = false;
}

function submitAnswer() {
    const btnNext = document.getElementById("btnNext");
    const feedbackBox = document.getElementById("feedbackBox");
    const q = questions[currentQuestion];

    if (btnNext.textContent === "Siguiente Pregunta") {
        currentQuestion++;
        loadQuestion();
        return;
    } else if (btnNext.textContent === "Ver Resultados") {
        showResults();
        return;
    }

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(btn => btn.disabled = true);

    if (selectedOption === q.answer) {
        score++;
        buttons[selectedOption].classList.add("correct");
        feedbackBox.className = "feedback-box show correct";
        feedbackBox.innerHTML = `<strong>¡Correcto!</strong> ${q.explanation}`;
    } else {
        buttons[selectedOption].classList.add("wrong");
        buttons[q.answer].classList.add("correct");
        feedbackBox.className = "feedback-box show wrong";
        feedbackBox.innerHTML = `<strong>Incorrecto.</strong> ${q.explanation}`;
    }

    if (currentQuestion < questions.length - 1) {
        btnNext.textContent = "Siguiente Pregunta";
    } else {
        btnNext.textContent = "Ver Resultados";
    }
}

function showResults() {
    const quizBody = document.getElementById("quizBody");
    const percentage = Math.round((score / questions.length) * 100);

    let feedbackMessage = "";
    if (percentage >= 80) {
        feedbackMessage = "¡Excelente trabajo! Demostraste una gran comprensión lectora de la historia de Colombia.";
    } else if (percentage >= 60) {
        feedbackMessage = "¡Buen esfuerzo! Repasa nuevamente las lecturas para perfeccionar tus respuestas.";
    } else {
        feedbackMessage = "Sigue practicando la lectura atenta de los textos históricos para mejorar tus resultados.";
    }

    quizBody.innerHTML = `
        <div class="results-card">
            <h2>Evaluación Finalizada</h2>
            <div class="results-score">${score} / ${questions.length}</div>
            <p style="font-size: 1.2rem; font-weight: 600; color: var(--primary); margin-bottom: 0.5rem;">Puntaje: ${percentage}%</p>
            <p class="results-msg">${feedbackMessage}</p>
            <button class="btn-restart" onclick="restartQuiz()">Reiniciar Examen</button>
        </div>
    `;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
